<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="龙虾">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🦞</text></svg>">
    <title>🦞 龙虾</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { 
            height: 100%; 
            width: 100%;
            overflow: hidden;
            background: #0f0f0f;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <iframe id="chatFrame" src="/chat"></iframe>
    <script>
        // 等 iframe 加载完成后注入 CSS 隐藏导航栏
        const iframe = document.getElementById('chatFrame');
        iframe.onload = function() {
            try {
                const style = document.createElement('style');
                style.textContent = `
                    /* 隐藏顶部导航 */
                    .app-header, .app-nav, nav, header { display: none !important; }
                    /* 隐藏侧边栏 */
                    .app-sidebar, .sidebar, aside { display: none !important; }
                    /* 让聊天区域占满 */
                    .app-main, main, .chat { 
                        margin: 0 !important; 
                        padding: 0 !important;
                        max-width: 100% !important;
                        height: 100vh !important;
                    }
                    .card.chat {
                        border-radius: 0 !important;
                        border: none !important;
                        height: 100vh !important;
                        max-height: 100vh !important;
                    }
                    /* 移动端优化 */
                    .chat-compose__field textarea {
                        font-size: 16px !important; /* 防止 iOS 缩放 */
                    }
                    /* 隐藏一些桌面端元素 */
                    .chat-compose__actions .btn:not(.primary) { display: none !important; }
                    kbd.btn-kbd { display: none !important; }
                `;
                iframe.contentDocument.head.appendChild(style);
            } catch (e) {
                console.log('Cannot inject styles (same-origin policy)');
            }
        };
    </script>
</body>
</html>
